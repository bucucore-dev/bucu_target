<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUCU Target System</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="target-container" class="hidden">
        <!-- Center Reticle Eye Container -->
        <div id="target-eye-wrapper" class="target-eye-wrapper">
            <!-- Pulsing Rings -->
            <div class="eye-outer-ring"></div>
            <div class="eye-spin-ring"></div>

            <!-- SVG Eye Reticle -->
            <div class="eye-core">
                <svg id="eye-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
        </div>

        <!-- Target Options Menu (Fanning out to the right of reticle) -->
        <div id="target-menu" class="target-menu hidden">
            <div class="target-menu-header">
                <span class="target-badge">INTERAKSI</span>
                <span class="target-hint">[R-CLICK / 1-5]</span>
            </div>
            <div id="target-options-list" class="target-options-list">
                <!-- Dynamically populated option cards -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
